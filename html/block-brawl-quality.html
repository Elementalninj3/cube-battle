addEventListener('keydown',e=>{if(KM.some(k=>Object.values(k).includes(e.code))||ACT[e.code])if(S.state==='play'||S.state==='count')e.preventDefault();K[e.code]=true;const a=ACT[e.code];if(a&&!e.repeat)BUF[a[0]][a[1]]=performance.now()/1e3;if(e.code==='Escape'&&!e.repeat)togglePause()});
addEventListener('keyup',e=>K[e.code]=false);addEventListener('blur',()=>{for(const k in K)K[k]=false;if(S.state==='play')togglePause()});
function upd(f,o,dt){const k=KM[f.i],now=performance.now()/1e3,B=BUF[f.i],p=f.p,play=S.state==='play';
f.t+=dt;f.dashCD=Math.max(0,f.dashCD-dt);f.inv=Math.max(0,f.inv-dt);f.flash=Math.max(0,f.flash-dt);f.rec=Math.max(0,f.rec-dt);
if(f.st==='ko')return;
p.x=Math.max(-6.6,Math.min(6.6,p.x));p.z=Math.max(-6.6,Math.min(6.6,p.z));const on=true;let ix=0,iy=0;if(play){ix=(K[k.r]|0)-(K[k.l]|0);iy=(K[k.u]|0)-(K[k.d]|0)}
let wx=ix-iy,wz=-ix-iy;const wl=Math.hypot(wx,wz);if(wl){wx/=wl;wz/=wl}
const has=n=>now-B[n]<.2,eat=n=>B[n]=-9;let ta=null;
if(f.st==='free'){if(on&&play&&f.rec<=0){if(has('D')&&f.dashCD<=0){eat('D');startDash(f,wl?{x:wx,z:wz}:f.face)}else if(has('H')){eat('H');startAtk(f,o,'H')}else if(has('L')){eat('L');startAtk(f,o,'L')}}
if(f.st==='free'&&on){const e=1-Math.exp(-(wl?16:11)*dt);f.v.x+=(wx*6.4-f.v.x)*e;f.v.z+=(wz*6.4-f.v.z)*e;ta=wl?Math.atan2(wx,wz):(o.st!=='ko'?Math.atan2(o.p.x-p.x,o.p.z-p.z):null)}}
else if(f.st==='atk'){const A=f.at,e=Math.exp(-7*dt);f.v.x*=e;f.v.z*=e;if(!f.hit&&f.t>=A.w){f.hit=true;strike(f,o)}
if(f.t>A.w+A.a&&play&&has('D')&&f.dashCD<=0){eat('D');startDash(f,wl?{x:wx,z:wz}:f.face)}else if(f.t>=A.w+A.a+A.r){f.st='free';f.at=null}}
else if(f.st==='dash'){f.v.copy(f.dd).multiplyScalar(18);f.tr-=dt;if(f.tr<=0){f.tr=.04;streakFx(f);emit(tmp.set(p.x,.1,p.z),(Math.random()-.5)*2,1,(Math.random()-.5)*2,0xe8e2c8,.1,.3,6)}if(f.t>.17){f.st='free';f.rec=.08;f.v.multiplyScalar(.3)}}
else if(f.st==='stun'){const e=Math.exp(-3*dt);f.v.x*=e;f.v.z*=e;if(f.t>=f.stun)f.st='free'}
if(ta!==null){let da=ta-f.ang;da=Math.atan2(Math.sin(da),Math.cos(da));f.ang+=da*Math.min(1,18*dt);f.face.set(Math.sin(f.ang),0,Math.cos(f.ang))}
p.x+=f.v.x*dt;p.z+=f.v.z*dt;
if(on&&p.y<=0&&f.vy<=0){p.y=0;f.vy=0}else{f.vy-=30*dt;p.y+=f.vy*dt}
if(p.y<-6||f.hp<=0)ko(f)}
function anim(f,dt,t){const s=Math.hypot(f.v.x,f.v.z),m=f.m;f.ph+=dt*s*2.4;const w=Math.min(1,s/4.5),la=Math.sin(f.ph)*.9*w;let aL=-la*.6,aR=la*.6,lean=0,sq=1,tw=Math.sin(f.ph)*.08*w;
if(f.st==='free'&&s<.5)sq=1+Math.sin(t*3+f.i)*.015;
const E=[0,0],U=[0,0];
if(f.st==='atk'){const A=f.at,H=A===ATK.H,rc=H?1.7:1.4,hu=H?.9:.25,u=f.t;let ex,uy;if(u<A.w){const e=u/A.w;ex=-.5*e;uy=hu*e;lean=-.25*e}else if(u<A.w+A.a){const e=(u-A.w)/A.a;ex=-.5+(rc+.5)*e;uy=hu*(1-e);lean=.45}else{const e=(u-A.w-A.a)/A.r;ex=rc*(1-e*.9);uy=0;lean=.3}E[1]=ex;U[1]=uy;if(H){E[0]=ex;U[0]=uy}else E[0]=-.25}
if(f.st==='stun'){lean=-.5;tw=Math.sin(t*40)*.06;sq=.95;E[0]=E[1]=-.3;U[0]=U[1]=.35}
if(f.st==='dash'){lean=.7;sq=.9;E[0]=E[1]=-.5}
f.legs[0].rotation.x=la;f.legs[1].rotation.x=-la;
f.arms.forEach((a,k)=>{const s=k?1:-1,x=Math.max(0,Math.min(1,E[k])),sw=(k?la:-la)*.35;a.rotation.x=0;a.position.set(s*(.78-.3*x),.35+U[k]+(f.st==='atk'?.2*x:0),E[k]+sw);a.scale.setScalar(1+.45*x*(f.at===ATK.H?1:.4))});m.rotation.x=lean;m.rotation.z=tw;m.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq));m.position.y=Math.abs(Math.sin(f.ph))*.06*w;
f.g.rotation.y=f.ang;const e=f.flash>0?.8:.05;f.mats.forEach(x=>x.emissive.setScalar(e));
f.sh.position.set(f.p.x,.03,f.p.z);const ss=Math.max(.3,1-Math.max(0,f.p.y)*.12);f.sh.scale.set(ss,ss,1);f.sh.material.opacity=Math.max(.25,1-Math.max(0,f.p.y)*.18);f.sh.visible=f.st!=='ko'&&f.p.y>-.5}
// camera
let zD=34;const look=new V3(),cp=new V3(),DIR=new V3(),GOAL=new V3();let orbit=0;
function camUpd(dt){const a=F.length&&(S.state==='play'||S.state==='count'||S.state==='ko'||S.state==='pause'||S.state==='over'),tg=tmp.set(0,.5,0);let D=34,dir;
if(a){const p0=F[0].p,p1=F[1].p,sep=Math.hypot(p0.x-p1.x,p0.z-p1.z);tg.set((p0.x+p1.x)*.3,.5,(p0.z+p1.z)*.3);D=Math.min(36,25+sep*.8)*Math.max(1,1.3/cam.aspect);dir=DIR.set(1,.95,1).normalize()}
else{orbit+=dt*.12;D=S.state==='select'?27:34;dir=DIR.set(Math.cos(orbit+.8),.9,Math.sin(orbit+.8)).normalize()}
const goal=GOAL.copy(tg).addScaledVector(dir,D),k=1-Math.exp(-4*dt);cp.lerp(goal,k);look.lerp(tg,1-Math.exp(-5*dt));cam.position.copy(cp);if(shake>0){cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake;shake=Math.max(0,shake-dt*1.2)}cam.lookAt(look)}
// flow
let cdT=0,lastN=0,koT=0,winner=0,prev='play',from='menu';
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));if(id)$(id).classList.add('on');$('hud').classList.toggle('on',['play','count','ko'].includes(S.state)||id==='pause'||id==='over')}
function startMatch(){setup();S.state='count';cdT=3.2;lastN=0;ts=1;hs=0;fxs.forEach(x=>rel(x.m));fxs.length=0;[0,1].forEach(i=>{$('n'+i).textContent=NAMES[cfg[i].c];$('h'+i).style.color='#fff';$('b'+i).style.background='#'+COLORS[cfg[i].c].toString(16).padStart(6,'0')});show(null)}
function togglePause(){if(S.state==='play'||S.state==='count'){prev=S.state;S.state='pause';show('pause')}else if(S.state==='pause'){S.state=prev;show(null)}}
function rs(){for(let i=0;i<2;i++){const c=cfg[i];$('sel'+i).innerHTML=`<b>Player ${i+1}</b><div>${COLORS.map((h,j)=>`<button class="sw${c.c==j?' on':''}" aria-label="${NAMES[j]}" data-a=col data-i=${i} data-v=${j} style="background:#${h.toString(16).padStart(6,'0')}"></button>`).join('')}</div><button data-a=hat data-i=${i}>Hat: ${HATS[c.h]}</button><button data-a=gl data-i=${i}>Visor: ${c.g?'on':'off'}</button>`}}
function pv(){setup();F.forEach(f=>f.v.set(0,0,0))}
document.addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;const i=+e.target.dataset.i;ac().resume&&ac().resume();
if(a==='play'){S.state='select';rs();pv();show('select')}
else if(a==='col'){const v=+e.target.dataset.v;cfg[i].c=v;while(cfg[1-i].c==cfg[i].c)cfg[1-i].c=(cfg[1-i].c+1)%6;rs();pv()}
else if(a==='hat'){cfg[i].h=(cfg[i].h+1)%HATS.length;rs();pv()}
else if(a==='gl'){cfg[i].g^=1;rs();pv()}
else if(a==='start'||a==='restart')startMatch();
else if(a==='menu'){S.state='menu';pv();show('menu')}
else if(a==='resume')togglePause();
else if(a==='set'){from=S.state==='pause'?'pause':'menu';show('settings')}
else if(a==='back')show(from)});
$('sv').oninput=e=>S.vol=e.target.value/100;$('sf').onchange=e=>$('fps').style.display=e.target.checked?'':'none';$('ss').oninput=e=>S.shake=e.target.value/100;$('sq').onchange=e=>{S.q=+e.target.value;scale=[.85,1,1][S.q];$('sr').value=scale*100;applyQ()};$('sr').oninput=e=>{scale=e.target.value/100;applyScale()};
// loop
let acc=0,STEP=1/60,last=performance.now(),T=0,fN=0,fS=performance.now();
function sim(dt){T+=dt;
if(S.state!=='pause'){let sd=dt*ts;if(hs>0){hs-=dt;sd=dt*.05}
if(['count','play','ko','over'].includes(S.state)&&F.length){
if(S.state==='count'){const n=Math.ceil(cdT);cdT-=dt;const nn=Math.ceil(cdT);$('cd').textContent=cdT>0?nn:cdT>-.6?'FIGHT!':'';if(nn!==lastN&&cdT>0){lastN=nn;sfx.beep(0)}if(cdT<=0&&S.state==='count'){S.state='play';sfx.beep(1)}}
else{cdT-=dt;if(cdT<-.6)$('cd').textContent=''}
upd(F[0],F[1],sd);upd(F[1],F[0],sd);
const a=F[0],b=F[1];if(a.st!=='dash'&&b.st!=='dash'&&a.st!=='ko'&&b.st!=='ko'){const dx=b.p.x-a.p.x,dz=b.p.z-a.p.z,d=Math.hypot(dx,dz);if(d<.9&&d>.001){const pu=(.9-d)/2;a.p.x-=dx/d*pu;a.p.z-=dz/d*pu;b.p.x+=dx/d*pu;b.p.z+=dz/d*pu}}
if(S.state==='play'&&(a.hp<=0||b.hp<=0)){a.hp<=0&&ko(a);b.hp<=0&&ko(b);S.state='ko';koT=0;ts=.3;winner=a.hp<=0&&b.hp<=0?(a.dmg<b.dmg?0:1):(a.hp<=0?1:0)}
if(S.state==='ko'){koT+=dt;if(koT>1.1){S.state='over';ts=1;$('win').textContent=NAMES[cfg[winner].c]+' wins!';$('win').style.color='#'+COLORS[cfg[winner].c].toString(16).padStart(6,'0');sfx.win();show('over')}}
F.forEach((f,i)=>{if(f.lh!==f.hp){f.lh=f.hp;$('b'+i).style.width=f.hp+'%';$('d'+i).textContent=Math.ceil(f.hp)}})}
else if(F.length){F.forEach(f=>{f.t+=dt;anim(f,dt,T)});}
for(let i=fxs.length-1;i>=0;i--){const x=fxs[i];x.t+=sd;const u=Math.min(1,x.t/x.dur);x.fn(u);if(u>=1){rel(x.m);fxs.splice(i,1)}}
let any=false;PP.forEach((q,i)=>{if(q.life<=0)return;any=true;q.life-=sd;if(q.life<=0)pd.scale.setScalar(0);else{q.v.y-=q.gr*sd;q.p.addScaledVector(q.v,sd);if(q.p.y<.05){q.p.y=.05;q.v.multiplyScalar(.6)}pd.scale.setScalar(q.s*q.life/q.max)}pd.position.copy(q.p);pd.updateMatrix();PI.setMatrixAt(i,pd.matrix)});if(any)PI.instanceMatrix.needsUpdate=true;
if(F.length&&['count','play','ko','over'].includes(S.state))F.forEach(f=>anim(f,sd,T));}
}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.1,(now-last)/1e3);last=now;fN++;if(now-fS>=500){$('fps').textContent=Math.round(fN*1000/(now-fS))+' FPS ('+R.info.render.calls+' draws)';fN=0;fS=now}acc+=dt;let n=0;while(acc>=STEP&&n++<8){sim(STEP);acc-=STEP}if(acc>STEP)acc=0;camUpd(dt);R.render(scene,cam)}
arena();setup();F.forEach(f=>f.v.set(0,0,0));cp.set(24,24,24);applyQ();R.compile(scene,cam);requestAnimationFrame(loop);
</script></body></html>
